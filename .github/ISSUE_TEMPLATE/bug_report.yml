name: 🐛 Bug 报告
description: 提交一个可复现的 Bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量提供完整信息以便复现。
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 清晰描述你遇到的问题
      placeholder: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现？
      placeholder: |
        1. 启动 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望看到什么？
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      description: Python 版本、操作系统、hermes-agent 版本
      placeholder: |
        - OS: Windows 11
        - Python: 3.12
        - hermes-agent: 0.19.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关日志或截图（如有）
    validations:
      required: false
