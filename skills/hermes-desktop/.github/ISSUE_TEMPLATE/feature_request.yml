name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议！请描述你希望加入的能力。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决了什么痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望怎么实现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有其他考虑过的方式？
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 截图、用例、参考等
    validations:
      required: false
